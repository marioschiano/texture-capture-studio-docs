<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Trim orizzontale e ripetizione</title><desc id="desc">Una fascia occupa tutta la larghezza UV e si ripete tre volte affiancata; le giunzioni sono indicate da linee tratteggiate.</desc>
  <defs><pattern id="mat" width="65" height="36" patternUnits="userSpaceOnUse"><rect width="65" height="36" fill="#b78d68"/><path d="M0 18H65 M32 0V18 M0 18V36 M64 18V36" fill="none" stroke="#704c38" stroke-width="3"/></pattern></defs>
  <rect width="900" height="330" rx="18" fill="#202935"/>
  <g fill="#f5f6f7" font-family="sans-serif" font-size="20"><text x="40" y="43">Fascia nella trim</text><text x="40" y="193">Controllo della ripetizione orizzontale</text><text x="40" y="139">U = 0</text><text x="315" y="139">U = 1</text><text x="40" y="304" font-size="16">Le linee tratteggiate indicano le giunzioni da controllare.</text></g>
  <rect x="40" y="60" width="330" height="55" fill="url(#mat)" stroke="#fff" stroke-width="2"/>
  <rect x="40" y="210" width="780" height="64" fill="url(#mat)" stroke="#fff" stroke-width="2"/>
  <path d="M300 202 V282 M560 202 V282" stroke="#ffe273" stroke-width="3" stroke-dasharray="7 5"/>
</svg>
